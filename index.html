<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강사 메일 답장 도우미</title>
<style>
  :root {
    /* 골라 쓴 색 세 가지 — 초록 · 흰색 · 먹색 */
    --point: #00A47C;
    --bg: #ffffff;
    --text: #111827;
    /* 위 세 가지에서 옅게 뽑아 쓰는 값들 */
    --point-dark: #008F6B;
    --card: #ffffff;
    --soft: #f7f8f8;
    --line: #e5e7eb;
    --muted: #6b7280;
    --tint: #E6F7F2;
    --tint-line: #bfe8db;
    --skin: #f4cfae;
    --skin-shade: #d9a882;
    --ink: #111827;
    --mine: #E6F7F2;
    --mine-line: #bfe8db;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  /* 화면 위쪽에 옅게 번지는 초록 빛 */
  body::before {
    content: "";
    position: fixed;
    top: -320px;
    left: 50%;
    width: 820px;
    height: 820px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 164, 124, .20) 0%, rgba(0, 164, 124, 0) 70%);
    pointer-events: none;
    z-index: -1;
  }
  body {
    background: transparent;
    margin: 0;
    padding: 40px 20px 72px;
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .notice { font-size: 12px; color: var(--muted); margin: 0 0 22px; }
  /* 로고 마크 — 초록 동그라미 안에 흰 체크 */
  .logo { display: block; width: 40px; height: 40px; margin: 0 auto 16px; }
  h1 {
    font-size: clamp(30px, 4.4vw, 46px);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
  }
  .sub { margin: 0 0 40px; font-size: 17px; color: var(--muted); }

  .layout {
    display: grid;
    grid-template-columns: 330px 1fr;
    gap: 20px;
    max-width: 1160px;
    margin: 0 auto;
    align-items: start;
  }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(17, 24, 39, .05);
    overflow: hidden;
  }
  .panel-head {
    padding: 17px 20px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  /* ── 왼쪽 : 강사님 목록 ───────────────────────── */
  .people { padding: 12px; max-height: 640px; overflow-y: auto; }
  .group { font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 8px; }
  .pick {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 5px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
    /* 라벨은 한 줄 — 중간에서 줄이 바뀌지 않게 */
    white-space: nowrap;
    overflow: hidden;
    /* 마우스를 올린 줄 · 고른 줄에 배경색이 스르륵 */
    transition: background-color .2s ease, border-color .2s ease;
  }
  .pick:hover { background: var(--soft); }
  .pick.on { background: var(--tint); border-color: var(--tint-line); }
  .pick .avatar { width: 34px; height: 34px; border-radius: 9px; }
  .pick .info { flex: 1; min-width: 0; }
  /* 성함과 과정명은 각각 한 줄 — 길면 끝을 …으로 줄임 */
  .pick .nm,
  .pick .md {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pick .nm { font-weight: 700; }
  .pick .md { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .pick .status { flex: 0 0 auto; }

  .avatar {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: var(--soft);
    image-rendering: pixelated;
    shape-rendering: crispEdges;
  }

  /* 상태 배지 */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  /* 다섯 상태를 색으로 구분 — 바탕은 옅게, 글자만 진하게 */
  .s-done    { background: var(--tint); color: var(--point);  border-color: var(--tint-line); }
  .s-wait    { background: #fef4e3; color: #a25c06; border-color: #f7dfb6; }
  .s-plan    { background: #f0ecfb; color: #5f4bc4; border-color: #ded5f6; }
  .s-progress{ background: #e8f1fd; color: #1d6fd0; border-color: #cfe0fa; }
  .s-hold    { background: #f3f4f6; color: var(--muted); border-color: var(--line); }
  /* 답을 기다리는 두 상태만 점이 깜빡임 */
  .s-wait .dot,
  .s-plan .dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  /* ── 오른쪽 위 : 고른 강사님 ──────────────────── */
  .who {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    padding: 20px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    overflow: hidden;
  }
  .who .nm { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .who .md { font-size: 13px; color: var(--muted); }

  /* ── 오른쪽 : 말풍선 ─────────────────────────── */
  .thread {
    padding: 26px 24px;
    max-height: 440px;
    overflow-y: auto;
    background: var(--soft);
  }
  .turn {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 18px;
  }
  .turn:last-child { margin-bottom: 0; }
  .turn.mine { justify-content: flex-end; }
  /* 말풍선이 아래에서 위로 톡 — 위에서부터 하나씩 차례로 */
  @keyframes popUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .turn {
    animation: popUp .28s ease-out both;
    animation-delay: var(--d, 0s);
  }
  .turn .avatar { width: 34px; height: 34px; border-radius: 8px; }
  .bubble {
    max-width: 74%;
    padding: 14px 18px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 15px;
    line-height: 1.65;
    word-break: keep-all;
    white-space: pre-line;
    /* 강사님에게 온 메일 — 왼쪽 정렬 */
    text-align: left;
  }
  .turn.mine .bubble {
    background: var(--mine);
    border-color: var(--mine-line);
    /* 내가 보낸 메일 — 오른쪽 정렬 */
    text-align: right;
  }
  .when { display: block; font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* ── 오른쪽 아래 : 답장 초안 ─────────────────── */
  .composer { padding: 22px 20px; border-top: 1px solid var(--line); }
  .btn {
    padding: 12px 24px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: var(--point);
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background-color .15s ease;
  }
  .btn:hover { background: var(--point-dark); }
  .btn[disabled] { cursor: default; }

  /* 글 쓰는 중 — 점 세 개가 잠깐 깜빡임 */
  .typing { display: none; justify-content: center; gap: 6px; margin-top: 18px; }
  .typing.on { display: flex; }
  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--point);
    animation: dot .8s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: .13s; }
  .typing span:nth-child(3) { animation-delay: .26s; }
  @keyframes dot {
    0%, 100% { opacity: .25; transform: translateY(0); }
    50%      { opacity: 1;   transform: translateY(-3px); }
  }

  /* 초안이 살짝 떠오르며 나타남 */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #draft {
    animation: fadeUp .28s ease-out both;
  }
  #draft {
    display: none;
    width: 100%;
    min-height: 300px;
    margin-top: 18px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--soft);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
    text-align: center;
    resize: vertical;
  }
  #draft:focus { outline: 2px solid var(--tint-line); outline-offset: -1px; }

  /* 이름을 누르면 캐릭터가 자동차를 타고 화면 가운데로 */
  .ride {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    transition: transform .4s ease-out, opacity .16s ease-in;
    will-change: transform;
  }
  .ride .avatar {
    width: 44px;
    height: 44px;
    margin-bottom: -9px;
    border-radius: 0;
    background: transparent;
  }
  .ride .car {
    display: block;
    width: 78px;
    height: auto;
    image-rendering: pixelated;
    shape-rendering: crispEdges;
  }
  .ride.gone { opacity: 0; }

  /* 움직임을 줄이도록 설정한 분에게는 애니메이션을 끔 */
  @media (prefers-reduced-motion: reduce) {
    .turn, #draft, .typing span { animation: none; }
    .pick, .ride { transition: none; }
  }
</style>
</head>
<body>
  <p class="notice">예시 자료로 만든 연습 화면입니다</p>

const STATUS_CLASS = {
  "확정": "s-done",
  "회신 대기": "s-wait",
  "강의안 대기": "s-plan",
  "일정 조율 중": "s-progress",
  "보류": "s-hold"
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// 픽셀 캐릭터 도안 (하나만 사용, 머리색·옷색만 바뀜)
function avatar(hair, shirt) {
  const px = (x, y, w, h, fill) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;
  return `
<svg class="avatar" viewBox="0 0 16 16" role="img" aria-hidden="true">
  ${px(4, 2, 8, 2, hair)}
  ${px(5, 4, 6, 1, hair)}
  ${px(4, 4, 1, 2, hair)}
  ${px(11, 4, 1, 2, hair)}
  ${px(5, 5, 6, 4, "var(--skin)")}
  ${px(4, 6, 1, 1, "var(--skin)")}
  ${px(11, 6, 1, 1, "var(--skin)")}
  ${px(6, 6, 1, 1, "var(--ink)")}
  ${px(9, 6, 1, 1, "var(--ink)")}
  ${px(7, 8, 2, 1, "var(--skin-shade)")}
  ${px(7, 9, 2, 1, "var(--skin-shade)")}
  ${px(4, 10, 8, 6, shirt)}
  ${px(3, 11, 1, 5, shirt)}
  ${px(12, 11, 1, 5, shirt)}
  ${px(7, 10, 2, 1, "var(--skin)")}
  ${px(3, 15, 1, 1, "var(--skin)")}
  ${px(12, 15, 1, 1, "var(--skin)")}
</svg>`;
}

// 픽셀 자동차 (아바타와 같은 방식, 몸통 색만 그 사람 옷색을 따라감)
function carSvg(shirt) {
  const px = (x, y, w, h, fill) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;
  return `
<svg class="car" viewBox="0 0 24 10" role="img" aria-hidden="true">
  ${px(2, 4, 20, 3, shirt)}
  ${px(3, 3, 4, 1, shirt)}
  ${px(16, 3, 5, 1, shirt)}
  ${px(1, 5, 1, 2, shirt)}
  ${px(22, 4, 2, 1, "#f0c473")}
  ${px(5, 7, 4, 2, "var(--ink)")}
  ${px(15, 7, 4, 2, "var(--ink)")}
  ${px(6, 8, 2, 1, "#9aa3b5")}
  ${px(16, 8, 2, 1, "#9aa3b5")}
</svg>`;
}

const PEOPLE = [];
ROWS.forEach((r, i) => PEOPLE.push({
  role: "강사", name: r.name, status: r.status,
  module: r.module, date: r.date, place: r.place, color: PALETTE[i % 8]
}));
ROWS.forEach((r, i) => PEOPLE.push({
  role: "보조강사", name: r.sub, status: r.subStatus,
  module: r.module, date: r.date, place: r.place, color: PALETTE[(i + 3) % 8]
}));

const WEEK = ["일", "월", "화", "수", "목", "금", "토"];

// "2026-08-25" → "8월 25일(화)"
function niceDate(text) {
  const [y, m, d] = text.split("-").map(Number);
  return `${m}월 ${d}일(${WEEK[new Date(y, m - 1, d).getDay()]})`;
}
// "2026-09-15(월) 10:00~13:00" → "9월 15일(월) 10:00~13:00"
function shortSchedule(text) {
  return text.replace(/^\d{4}-(\d{2})-(\d{2})/, (_, m, d) => `${Number(m)}월 ${Number(d)}일`);
}

// 지금은 버튼을 눌러도 미리 넣어둔 예시 문장만 나옵니다 (5부분 · 14줄)
function sampleDraft(p) {
  return `안녕하세요, ${p.name} ${p.role}님.
알고링크 전미정 입니다.

${p.module} 과정 관련해 회신드립니다.

· 일시 : ${shortSchedule(p.date)}
· 장소 : ${p.place}

문의 주신 사항은 확인 후 다시 안내드리겠습니다.
당일에는 시작 30분 전까지 도착 부탁드립니다.

늘 도움 주셔서 감사합니다.

알고링크 전미정 드림`;
}

function badge(status) {
  return `<span class="status ${STATUS_CLASS[status] || "s-hold"}"><span class="dot"></span>${esc(status)}</span>`;
}

// 왼쪽 한 줄 — 아바타 + 성함 · 과정명 + 상태
function pickRow(p, i) {
  return `
    <button type="button" class="pick" data-i="${i}">
      ${avatar(p.color.hair, p.color.shirt)}
      <span class="info">
        <span class="nm">${esc(p.name)}</span>
        <span class="md">${esc(p.module)}</span>
      </span>
      ${badge(p.status)}
    </button>`;
}

peopleEl.innerHTML =
  `<p class="group">강사</p>` +
  PEOPLE.slice(0, ROWS.length).map((p, i) => pickRow(p, i)).join("") +
  `<p class="group">보조강사</p>` +
  PEOPLE.slice(ROWS.length).map((p, i) => pickRow(p, i + ROWS.length)).join("");

function show(i) {
  picked = PEOPLE[i];

  document.querySelectorAll(".pick").forEach((b) =>
    b.classList.toggle("on", b.dataset.i === String(i)));

  // 맨 위 한 줄 — 아바타 · 성함 · 맡으신 모듈과 일정
  whoEl.innerHTML = `
    <div class="who">
      ${avatar(picked.color.hair, picked.color.shirt)}
      <span class="nm">${esc(picked.name)} ${esc(picked.role)}님</span>
      <span class="md">${esc(picked.module)} · ${esc(shortSchedule(picked.date))}</span>
    </div>`;

  // 오래된 것부터 아래로 — 강사님은 왼쪽(아바타 붙임), 나는 오른쪽
  // 위에서부터 하나씩 차례로 떠오르도록 말풍선마다 시작을 조금씩 늦춤
  threadEl.innerHTML = (MAILS[picked.name] || []).map((m, n) => {
    const mine = m.from === "나";
    return `
    <div class="turn ${mine ? "mine" : ""}" style="--d:${(n * 0.08).toFixed(2)}s">
      ${mine ? "" : avatar(picked.color.hair, picked.color.shirt)}
      <div class="bubble">${esc(m.text)}<span class="when">${esc(niceDate(m.date))}</span></div>
    </div>`;
  }).join("");
  threadEl.scrollTop = 0;

  clearTimeout(typingTimer);
  typingEl.classList.remove("on");
  makeBtn.disabled = false;
  draftEl.style.display = "none";
  draftEl.value = "";
}

// 누른 줄에서 화면 한가운데까지 0.4초 — 도착하면 사라지고 메일 내역이 뜸
let ride = null;
let rideTimers = [];

function clearRide() {
  rideTimers.forEach(clearTimeout);
  rideTimers = [];
  if (ride) { ride.remove(); ride = null; }
}

function driveToCenter(fromEl, p, done) {
  clearRide();

  // 움직임을 줄이도록 설정한 분에게는 바로 보여줌
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { done(); return; }

  const start = fromEl.getBoundingClientRect();
  ride = document.createElement("div");
  ride.className = "ride";
  ride.innerHTML = avatar(p.color.hair, p.color.shirt) + carSvg(p.color.shirt);
  ride.style.left = start.left + "px";
  ride.style.top = start.top + "px";
  document.body.appendChild(ride);

  const dx = window.innerWidth / 2 - (start.left + ride.offsetWidth / 2);
  const dy = window.innerHeight / 2 - (start.top + ride.offsetHeight / 2);

  requestAnimationFrame(() => {
    if (ride) ride.style.transform = `translate(${dx}px, ${dy}px)`;
  });

  rideTimers.push(setTimeout(() => { if (ride) ride.classList.add("gone"); }, 400));
  rideTimers.push(setTimeout(() => { clearRide(); done(); }, 560));
}

peopleEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".pick");
  if (!btn) return;
  const i = Number(btn.dataset.i);

  // 고른 줄 표시는 바로, 메일 내역은 자동차가 도착한 뒤
  document.querySelectorAll(".pick").forEach((b) =>
    b.classList.toggle("on", b.dataset.i === String(i)));

  driveToCenter(btn, PEOPLE[i], () => show(i));
});

// 누르면 점 세 개가 잠깐 깜빡였다가 문장이 나타남
makeBtn.addEventListener("click", () => {
  if (!picked) return;
  clearTimeout(typingTimer);
  draftEl.style.display = "none";
  makeBtn.disabled = true;
  typingEl.classList.add("on");

  typingTimer = setTimeout(() => {
    typingEl.classList.remove("on");
    makeBtn.disabled = false;
    draftEl.value = sampleDraft(picked);
    draftEl.style.display = "block";
    draftEl.focus();
  }, 620);
});

show(0);
</script>
</body>
</html>
